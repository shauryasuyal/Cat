<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooch Meow 🐱</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #fff8f2, #fdf0f5);
        font-family: Arial, sans-serif;
        cursor: crosshair;
    }

    .hint {
        position: fixed;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: #765f68;
        pointer-events: none;
        z-index: 10;
    }

    .hint b {
        display: block;
        font-size: 22px;
        color: #57434c;
    }

    .hint span {
        font-size: 13px;
        opacity: 0.75;
    }

    .cat {
        position: absolute;
        width: 78px;
        height: 72px;
        pointer-events: none;
        transition: none;
        z-index: 5;
        object-fit: contain;
    }

    .kiss {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 30px; /* This controls the emoji size */
        font-weight: bold;
        color: #ff4d6d; 
        white-space: nowrap; 
        pointer-events: none;
        z-index: 20;
        animation: kiss .8s ease-out forwards;
    }

    /* Target the span specifically to make the text smaller */
    .kiss-text {
        font-size: 18px; 
        vertical-align: middle; /* Keeps it aligned nicely with the larger emoji */
    }

    @keyframes kiss {
        0% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(.3) rotate(-15deg);
        }

        25% {
            opacity: 1;
            transform: translate(-50%, -70%) scale(1.2) rotate(8deg);
        }

        100% {
            opacity: 0;
            transform: translate(-50%, -125%) scale(.9) rotate(12deg);
        }
    }
</style>
</head>

<body>

<div class="hint">
    <b>Boop da screen</b>
    <span>click anywhere, meowsie will come and give you a mwah</span>
</div>

<img src="img" class="cat" id="cat" alt="Meow">

<script>
const cat = document.getElementById("cat");

let catX = window.innerWidth / 2 - 39;
let catY = window.innerHeight / 2 - 36;

cat.style.left = catX + "px";
cat.style.top = catY + "px";

let animation = null;

// Audio Setup
const sounds = [
    new Audio('v1.m4a'),
    new Audio('v2.m4a'),
    new Audio('v3.m4a'),
    new Audio('v4.m4a')
];
let currentSoundIndex = 0;

document.addEventListener("click", function(event) {
    const targetX = event.clientX - 39;
    const targetY = event.clientY - 36;

    const startX = catX;
    const startY = catY;

    const distance = Math.hypot(
        targetX - startX,
        targetY - startY
    );

    const duration = Math.max(500, distance * 5);

    const startTime = performance.now();

    function move(time) {
        let progress = (time - startTime) / duration;
        progress = Math.min(progress, 1);

        // Smooth acceleration/deceleration
        const eased =
            progress < 0.5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        catX = startX + (targetX - startX) * eased;
        catY = startY + (targetY - startY) * eased;

        cat.style.left = catX + "px";
        cat.style.top = catY + "px";

        if (progress < 1) {
            animation = requestAnimationFrame(move);
        } else {
            kiss(event.clientX, event.clientY);
        }
    }

    if (animation) {
        cancelAnimationFrame(animation);
    }

    animation = requestAnimationFrame(move);
});

function kiss(x, y) {
    // 1. Create the visual kiss
    const kissElement = document.createElement("div");
    kissElement.className = "kiss";
    
    // Changed textContent to innerHTML so we can style the text independently 
    kissElement.innerHTML = '💋 <span class="kiss-text">MWAH</span>';

    kissElement.style.left = x + "px";
    kissElement.style.top = y + "px";

    document.body.appendChild(kissElement);

    // 2. Play the current sound
    const soundToPlay = sounds[currentSoundIndex].cloneNode();
    soundToPlay.play();

    // 3. Move to the next sound in the loop (0 -> 1 -> 2 -> 3 -> 0)
    currentSoundIndex = (currentSoundIndex + 1) % sounds.length;

    // 4. Cleanup the visual element
    setTimeout(() => {
        kissElement.remove();
    }, 800);
}
</script>

</body>
</html>
